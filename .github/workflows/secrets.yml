name: Saludo secretos
run-name: ¡Estoy aprendiendo a usar Secretos!
on:
  workflow_dispatch
env:
  DIA_DE_SEMANA: Lunes
jobs:
  saludo-variables:
    runs-on: ubuntu-latest
    env:
      SALUDO: Hola
    steps:
      - name: Saludar
        run: echo "$SALUDO, $NOMBRE ${{VARS.APELLIDO}}. Hoy es $DIA_DE_SEMANA!"
        env:
          NOMBRE: Angel
  saludo-secretos:
      runs-on: ubuntu-latest
    env:
      SALUDO: Hola
    steps:
      - name: Saludos Secretos
        run: echo "$SALUDO,  ${{VARS.APELLIDO}}. To ocntraseña es !"
